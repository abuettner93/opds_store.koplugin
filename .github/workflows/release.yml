name: Build & Publish Release Archive

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: 'opds_store.koplugin'

      - name: Create zip archive
        run: |
          zip -r opds_store.koplugin.zip opds_store.koplugin \
            -x '**/.git/*' \
            -x '**/.github/*' \
            -x '**/*.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opds_store.koplugin
          path: opds_store.koplugin.zip

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: opds_store.koplugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: opds_store.koplugin.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
